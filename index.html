<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>페이스북카페24 사진 업로드</title>
<meta name="theme-color" content="#3f6b26">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="카페24 업로드">
<style>
:root{--g:#3f6b26;--g2:#e6f0dc;--bd:#dfe5d6;--mut:#6e7968;--red:#a33224}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f3f5ef;color:#1f2a1c}
header{background:var(--g);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:17px}header button{background:transparent;border:1px solid #ffffff80;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.w{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:#fff}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.sm{padding:7px 12px;font-size:13px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:1em}.hidden{display:none!important}
.mall{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.mall.off .mh label,.mall.off .row{opacity:.55}.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mh label{margin:0;color:#1f2a1c;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.mh input[type=checkbox]{width:20px;height:20px}
.tag{font-size:12px;border-radius:20px;padding:3px 9px;background:var(--g2);color:var(--g);font-weight:700}
.tag.no{background:#fbe3e0;color:var(--red)}
.tg{display:flex;gap:14px;margin-top:8px;font-size:14px}.tg label{display:flex;gap:6px;align-items:center;margin:0;color:#1f2a1c}
.tg input{width:18px;height:18px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;position:relative}
#drop img{max-width:220px;max-height:220px;border-radius:8px;display:block;margin:0 auto 8px}
.res{padding:10px 12px;border-radius:10px;margin:6px 0;font-size:14px}.res.ok{background:var(--g2)}.res.bad{background:#fbe3e0;color:var(--red)}
.res a{color:var(--g);font-weight:700}
.note{font-size:12px;color:var(--mut);margin-top:6px}
</style></head><body>
<header><b>📷 페이스북카페24 사진 업로드</b><button id="out" class="hidden">로그아웃</button></header>
<div class="w">

<div id="login" class="card hidden">
  <h2>관리자 로그인</h2>
  <form id="lf"><label>전화번호</label><input id="lp" inputmode="tel" placeholder="010-0000-0000" autocomplete="username">
  <label>비밀번호</label><input id="lw" type="password" autocomplete="current-password">
  <div class="err" id="le"></div><button class="btn" style="width:100%;margin-top:6px">로그인</button></form>
  <div class="note">도매 앱의 관리자 번호로 로그인해요.</div>
</div>

<div id="main" class="hidden">
  <div id="msg"></div>
  <div class="card">
    <h2>상품 정보</h2>
    <label>상품명 *</label><input id="pn" placeholder="예: Lucky Me Pancit Canton Kalamansi">
    <div class="row"><div><label>규격 / 요약 설명</label><input id="ps" placeholder="예: 60g x 10pcs"></div>
    <div><label>공급가(원가)</label><input id="pc" inputmode="numeric" placeholder="0"></div></div>
    <label>상세 설명</label><textarea id="pd" placeholder="상품 설명 (선택)"></textarea>
    <label>대표 사진</label>
    <div id="drop"><div id="dropT">눌러서 사진 고르기 (또는 끌어다 놓기)</div><input id="pf" type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer"></div>
  </div>

  <div class="card">
    <h2>올릴 쇼핑몰</h2>
    <div id="malls"></div>
    <div id="pastebox" class="mall hidden" style="background:#fffbe9">
      <b style="font-size:14px">연결 마무리</b>
      <div class="note" style="margin:4px 0 8px">새 탭에서 <b>허용</b>을 누르면 "404" 페이지가 떠요. 그 탭의 <b>주소창 주소 전체</b>를 복사해서 여기에 붙여 넣으세요. (1분 안에)</div>
      <div style="display:flex;gap:8px"><input id="pasteurl" placeholder="https://philmart2026-kim.github.io/?code=..."><button class="btn sm" id="pastego">연결</button></div>
    </div>
    <div class="note">가격은 쇼핑몰마다 다르게 넣을 수 있어요. 처음 넣은 가격이 다른 쇼핑몰에도 채워져요.</div>
  </div>

  <button id="go" class="btn" style="width:100%">카페24에 등록하기</button>
  <div id="out2" style="margin-top:12px"></div>
</div>
</div>
<script>
const SUPA='https://pebygdhmzxhoxooddcjz.supabase.co', KEY='sb_publishable_NhUf1QKCMxH81wGqOf2AMg_0ATjywjK';
const FN=SUPA+'/functions/v1/cafe24-admin', RED='https://philmart2026-kim.github.io';
const SCOPE='mall.read_application,mall.write_application,mall.read_category,mall.write_category,mall.read_product,mall.write_product';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const H={'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY};
const rpc=(f,a)=>fetch(`${SUPA}/rest/v1/rpc/${f}`,{method:'POST',headers:H,body:JSON.stringify(a||{})}).then(r=>r.json());
const fn=a=>fetch(FN,{method:'POST',headers:H,body:JSON.stringify(a)}).then(r=>r.json());
let token=LS.get('pm-c24-token'), malls=[], cats={}, imgB64=null;
const say=(t,ok)=>$('#msg').innerHTML=t?`<div class="res ${ok?'ok':'bad'}">${t}</div>`:'';

// 카페24 연결 후 돌아왔을 때
(async()=>{
  const q=new URLSearchParams(location.search), code=q.get('code'), st=q.get('state')||'';
  // ERP에서 넘어온 값 기억
  ['name','spec','price','cost'].forEach(k=>{ if(q.get(k)!=null) LS.set('pm-c24-pre-'+k,q.get(k)); });
  if(code&&st.startsWith('c24_')){
    const mall=st.slice(4); history.replaceState(null,'',location.pathname);
    const j=await fn({action:'exchange',mall,code,redirect_uri:RED}).catch(e=>({ok:false,err:String(e)}));
    LS.set('pm-c24-flash', j.ok? `✅ ${mall} 연결 완료` : `❌ ${mall} 연결 실패: ${j.err||''}`);
  } else if(q.get('error')) LS.set('pm-c24-flash','❌ 연결 취소/거절: '+(q.get('error_description')||q.get('error')));
  if(code||[...q.keys()].length) history.replaceState(null,'',location.pathname);
  start();
})();

$('#lf').onsubmit=async e=>{ e.preventDefault(); $('#le').textContent='';
  const r=await rpc('app_login',{p_phone:$('#lp').value,p_pw:$('#lw').value}).catch(()=>({ok:false,err:'net'}));
  if(!r.ok){ $('#le').textContent= r.err==='wrong_pw'?'비밀번호가 맞지 않아요.': r.err==='locked'?'잠시 뒤 다시 해 주세요.':'로그인할 수 없어요.'; return; }
  token=r.token; LS.set('pm-c24-token',token); start(); };
$('#out').onclick=()=>{ rpc('app_logout',{p_token:token}).catch(()=>{}); token=null; LS.del('pm-c24-token'); start(); };

async function start(){
  const show=id=>{ $('#login').classList.toggle('hidden',id!=='login'); $('#main').classList.toggle('hidden',id!=='main'); $('#out').classList.add('hidden'); };
  show('main');
  const f=LS.get('pm-c24-flash'); if(f){ say(f,!f.startsWith('❌')); LS.del('pm-c24-flash'); }
  const pre=k=>LS.get('pm-c24-pre-'+k);
  if(pre('name')!=null){ $('#pn').value=pre('name'); $('#ps').value=pre('spec')||''; $('#pc').value=pre('cost')||''; }
  const m=await fn({action:'malls'}); malls=m.malls||[];
  const order=['hnlmall','muramart','pmtraders']; malls.sort((a,b)=>order.indexOf(a.mall)-order.indexOf(b.mall));
  $('#malls').innerHTML=malls.map(x=>{
    const sc=LS.get('pm-c24-lite-'+x.mall)?'mall.read_application,mall.write_application,mall.read_product,mall.write_product':SCOPE;
    const link=x.client_id?`https://${x.mall}.cafe24api.com/api/v2/oauth/authorize?response_type=code&client_id=${x.client_id}&state=c24_${x.mall}&redirect_uri=${encodeURIComponent(RED)}&scope=${sc}`:'';
    return `<div class="mall ${x.connected?'':'off'}" data-m="${x.mall}">
      <div class="mh"><label><input type="checkbox" class="use" ${x.connected?'checked':'disabled'}> ${esc(x.label)} <small style="color:var(--mut);font-weight:400">${x.mall}</small></label>
      ${x.connected? (x.scopes.includes('mall.write_category')?`<span class="tag">연결됨</span>`:`<span style="display:flex;gap:6px;align-items:center"><span class="tag">연결됨</span><a class="btn sm ghost rc" href="${link.replace(/scope=[^&]*/,'scope='+SCOPE)}" target="_blank">메인진열 권한 다시 연결</a></span>`): !x.client_id?`<span class="tag no">앱 정보 필요</span>`: x.has_secret?`<a class="btn sm" href="${link}" target="_blank">연결하기</a>`:`<span class="tag no">① Secret 넣기</span>`}</div>
      ${!x.connected&&x.client_id&&!x.has_secret?`<div style="display:flex;gap:8px;margin-top:8px"><input class="sec" placeholder="카페24 앱의 Client Secret 붙여넣기" autocomplete="off"><button class="btn sm secgo">저장</button></div>`:''}
      <div class="row"><div><label>판매가 *</label><input class="pr" inputmode="numeric" value="${esc(pre('price')||'')}" ${x.connected?'':'disabled'}></div>
      <div><label>분류 (카테고리)</label><select class="ct" ${x.connected?'':'disabled'}><option value="">${x.connected?'불러오는 중…':'연결하면 이 쇼핑몰 분류가 나와요'}</option></select></div></div>
      ${x.connected?`<label>메인 진열</label><div class="mains" style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px">불러오는 중…</div>
      <div class="tg"><label><input type="checkbox" class="dp" checked> 진열</label><label><input type="checkbox" class="sl" checked> 판매</label></div>`:''}
    </div>`; }).join('');
  document.querySelectorAll('.mall a[target]').forEach(a=>a.addEventListener('click',()=>{ $('#pastebox').classList.remove('hidden'); setTimeout(()=>$('#pasteurl').focus(),300); }));
  document.querySelectorAll('.secgo').forEach(bt=>bt.onclick=async()=>{ const d=bt.closest('.mall'), v=d.querySelector('.sec').value.trim(); if(v.length<10){ alert('Client Secret을 붙여 넣어 주세요.'); return; }
    bt.disabled=true; const j=await fn({action:'set_secret',mall:d.dataset.m,secret:v}).catch(e=>({ok:false,err:String(e)}));
    if(j.ok){ LS.set('pm-c24-flash','✅ '+d.dataset.m+' Secret 저장 완료 — 이제 연결하기를 눌러 주세요'); start(); } else { bt.disabled=false; say('❌ 저장 실패: '+(j.err||''),false); } });
  if(malls.some(x=>!x.connected&&x.has_secret)) $('#pastebox').classList.remove('hidden');
  document.querySelectorAll('.mall .use').forEach(c=>c.onchange=()=>c.closest('.mall').classList.toggle('off',!c.checked));
  const prs=[...document.querySelectorAll('.mall .pr')]; prs.forEach(p=>p.addEventListener('input',()=>{ prs.forEach(o=>{ if(o!==p&&!o.dataset.touched) o.value=p.value; }); p.dataset.touched=1; }));
  for(const x of malls.filter(x=>x.connected)){ loadCats(x.mall); loadMains(x); }
}
async function loadMains(x){
  const box=document.querySelector(`.mall[data-m="${x.mall}"] .mains`); if(!box) return;
  const j=await fn({action:'mains',mall:x.mall}).catch(()=>({ok:false}));
  if(!j.ok||!j.mains){ box.innerHTML='<span class="note">이 쇼핑몰 앱에 분류 권한이 없어서 메인 진열을 못 불러왔어요.</span>'; return; }
  const canW=x.scopes.includes('mall.write_category');
  box.innerHTML=j.mains.map(m=>`<label style="display:flex;gap:5px;align-items:center;margin:0;color:#1f2a1c"><input type="checkbox" class="mn" value="${m.group}" ${canW?'':'disabled'} style="width:17px;height:17px"> ${esc(m.name)}</label>`).join('')
    + (canW?'':'<div class="note" style="width:100%">메인 진열을 고르려면 위의 "메인진열 권한 다시 연결"을 해 주세요.</div>');
}
async function loadCats(mall){
  const sel=document.querySelector(`.mall[data-m="${mall}"] .ct`); if(!sel) return;
  try{ const j=await fn({action:'categories',mall,token}); if(!j.ok) throw new Error(j.err);
    const L=(j.categories||[]).filter(c=>c.display_type!=='F').sort((a,b)=>String(a.full_category_name?.[1]||a.category_name).localeCompare(String(b.full_category_name?.[1]||b.category_name)));
    const nm=c=>{ const f=c.full_category_name; return f? Object.values(f).filter(Boolean).join(' > ') : c.category_name; };
    const last=LS.get('pm-c24-cat-'+mall);
    sel.innerHTML='<option value="">— 분류 고르기 —</option>'+L.map(c=>`<option value="${c.category_no}" ${String(c.category_no)===last?'selected':''}>${esc(nm(c))}</option>`).join('');
  }catch(e){ sel.innerHTML='<option value="">카테고리를 못 불러왔어요</option>'; }
}

// 사진: 긴 변 1200px로 줄여 JPEG로
async function doPaste(v){
  let u; try{ u=new URL(v.trim()); }catch(e){ say('❌ 주소를 그대로 붙여 넣어 주세요.',false); return; }
  const code=u.searchParams.get('code'), st=u.searchParams.get('state')||'';
  if(u.searchParams.get('error')){ $('#pasteurl').value='';
    if(u.searchParams.get('error')==='invalid_scope'){ const m=(u.searchParams.get('state')||'').slice(4)||'pmtraders'; LS.set('pm-c24-lite-'+m,'1'); LS.set('pm-c24-flash','⚠️ '+m+' 앱에 분류 권한이 없어서, 분류 없이 연결하도록 바꿨어요. 연결하기를 다시 눌러 주세요.'); start(); return; }
    say('❌ 연결이 거절됐어요: '+(u.searchParams.get('error_description')||u.searchParams.get('error')),false); return; }
  if(!code||!st.startsWith('c24_')){ say('❌ 주소에 연결 코드가 없어요. 허용 후 뜬 주소를 복사해 주세요.',false); return; }
  const mall=st.slice(4); say('연결하는 중…',true);
  const j=await fn({action:'exchange',mall,code,redirect_uri:RED}).catch(e=>({ok:false,err:String(e)}));
  $('#pasteurl').value='';
  if(j.ok){ LS.set('pm-c24-flash','✅ '+mall+' 연결 완료'); start(); }
  else say('❌ '+mall+' 연결 실패: '+(String(j.err||'').includes('no_secret')?'Supabase에 Secret이 아직 없어요.':String(j.err||'').includes('invalid_grant')?'코드 시간이 지났어요. 연결하기를 다시 눌러 주세요.':j.err),false);
}
$('#pastego').onclick=()=>doPaste($('#pasteurl').value);
$('#pasteurl').addEventListener('paste',e=>setTimeout(()=>doPaste($('#pasteurl').value),50));
$('#pf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const im=new Image();
  im.onload=()=>{ const s=Math.min(1,1200/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',.9); imgB64=d.split(',')[1]; $('#dropT').innerHTML=`<img src="${d}">다른 사진으로 바꾸려면 다시 누르세요`; URL.revokeObjectURL(im.src); };
  im.src=URL.createObjectURL(f); };

$('#go').onclick=async()=>{
  const name=$('#pn').value.trim(); if(!name){ alert('상품명을 넣어 주세요.'); return; }
  const sel=[...document.querySelectorAll('.mall')].filter(d=>d.querySelector('.use:checked')).map(d=>({
    mall:d.dataset.m, price:Number((d.querySelector('.pr')?.value||'').replace(/[^\d]/g,'')), category_no:d.querySelector('.ct')?.value||'',
    display:d.querySelector('.dp')?.checked, selling:d.querySelector('.sl')?.checked, mains:[...d.querySelectorAll('.mn:checked')].map(c=>Number(c.value)) }));
  if(!sel.length){ alert('올릴 쇼핑몰을 하나 이상 골라 주세요.'); return; }
  const bad=sel.find(s=>!s.price); if(bad){ alert('판매가를 넣어 주세요: '+bad.mall); return; }
  if(!imgB64&&!confirm('사진 없이 등록할까요?')) return;
  sel.forEach(s=>s.category_no&&LS.set('pm-c24-cat-'+s.mall,s.category_no));
  $('#go').disabled=true; $('#go').textContent='등록하는 중…';
  const j=await fn({action:'create',token,malls:sel,image:imgB64,product:{name,spec:$('#ps').value.trim(),supply_price:Number(($('#pc').value||'0').replace(/[^\d]/g,''))||0,description:$('#pd').value.replace(/\n/g,'<br>')}}).catch(e=>({ok:false,err:String(e)}));
  $('#go').disabled=false; $('#go').textContent='카페24에 등록하기';
  const lab=m=>(malls.find(x=>x.mall===m)||{}).label||m;
  $('#out2').innerHTML= j.ok? j.results.map(r=>r.ok?`<div class="res ok">✅ ${esc(lab(r.mall))} 등록 완료 · 상품번호 ${r.product_no} ${r.url?`· <a href="${r.url}" target="_blank">보기</a>`:''}${r.img_err?`<br><span style="color:var(--red)">⚠️ 사진은 못 올렸어요. 카페24에서 직접 넣어 주세요.</span>`:''}${r.main_err?`<br><span style="color:var(--red)">⚠️ 메인 진열은 못 넣었어요. 카페24에서 체크해 주세요.</span>`:''}</div>`:`<div class="res bad">❌ ${esc(lab(r.mall))}: ${esc(r.err)}</div>`).join('') : `<div class="res bad">❌ ${esc(j.err||'오류')}</div>`;
  if(j.ok&&j.results.every(r=>r.ok)){ ['name','spec','price','cost'].forEach(k=>LS.del('pm-c24-pre-'+k)); }
};
</script></body></html>
